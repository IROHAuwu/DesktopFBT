name: Real model check

# 用真的 RTMW3D、GEM-X 模型跑測試（要下載模型，比較久）：只手動執行。
on:
  workflow_dispatch:

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps rtmlib
      - name: Video tests
        run: python tests/test_video.py
      - name: Real RTMW3D model
        env:
          DESKTOPFBT_REAL_MODEL: '1'
        run: python tests/test_rtmw3d.py
      # 真的 GEM-X 模型（自動下載約 3.5 GB）在有正確答案的圖片上跑 App 的流程
      - name: Real GEM-X models
        env:
          DESKTOPFBT_REAL_MODEL: '1'
        run: python tests/test_gemx_real.py
